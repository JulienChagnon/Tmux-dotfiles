# Default shell
set -g default-shell /bin/bash

# True color support
set -g default-terminal "tmux-256color"
set -g allow-passthrough off
# Use direct RGB escape sequences without Tc/RGB feature flags.
# Tc triggers RGB feature detection which makes tmux send OSC 10/11 colour
# queries — their responses leak into shell input on SSH reconnect.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g terminal-features[0] "xterm*:clipboard:title"


 
# Enable OSC52 clipboard passthrough
set -g set-clipboard on
 
# Disable focus events to prevent CLI startup hangs
set -g focus-events off
 
# Escape time - low for responsive input over SSH
set -sg escape-time 5
 
# Disable paste detection (prevents fast typing from being swallowed)
set -g assume-paste-time 0
 
# Update DISPLAY environment variable
set -g update-environment "DISPLAY"
 
# -- navigation ----------------------------------------------------------------
 
# -- windows & pane creation ---------------------------------------------------
 
# new window retains current path
tmux_conf_new_window_retain_current_path=false
 
# new pane retains current path
tmux_conf_new_pane_retain_current_path=true
 
# new pane tries to reconnect ssh sessions (experimental)
tmux_conf_new_pane_reconnect_ssh=false
 
# prompt for session name when creating a new session
tmux_conf_new_session_prompt=false
 
 
# -- display -------------------------------------------------------------------
 
# RGB 24-bit colour support (tmux >= 2.2)
tmux_conf_theme_24b_colour=true
 
# window style
tmux_conf_theme_window_fg='default'
tmux_conf_theme_window_bg='default'
 
# highlight focused pane (tmux >= 2.1)
tmux_conf_theme_highlight_focused_pane=false
 
# focused pane colours:
tmux_conf_theme_focused_pane_fg='default'
tmux_conf_theme_focused_pane_bg='#0087d7'               # light blue
 
# pane border style
tmux_conf_theme_pane_border_style=thin
 
# pane borders colours:
tmux_conf_theme_pane_border='#444444'                   # gray
tmux_conf_theme_pane_active_border='#00afff'            # light blue
 
# zoom indicator in pane border
set -g pane-border-status off
set -g pane-border-format "🔍 ZOOMED"
set-hook -g after-resize-pane 'if -F "#{window_zoomed_flag}" "set pane-border-status top" "set pane-border-status off"'
 
# pane indicator colours
tmux_conf_theme_pane_indicator='#00afff'                # light blue
tmux_conf_theme_pane_active_indicator='#00afff'         # light blue
 
# status line style
tmux_conf_theme_message_fg='#000000'                    # black
tmux_conf_theme_message_bg='#ffff00'                    # yellow
tmux_conf_theme_message_attr='bold'
 
# status line command style (<prefix> : Escape)
tmux_conf_theme_message_command_fg='#ffff00'            # yellow
tmux_conf_theme_message_command_bg='#000000'            # black
tmux_conf_theme_message_command_attr='bold'
 
# window modes style
tmux_conf_theme_mode_fg='#000000'                       # black
tmux_conf_theme_mode_bg='#ffff00'                       # yellow
tmux_conf_theme_mode_attr='bold'
 
# -- status bar ----------------------------------------------------------------
set-option -g status-justify left
set-option -g status-left '#[bg=colour237] #[bg=colour236] #[bg=colour235]#[fg=colour185] #S #[bg=colour236] '
set-option -g status-left-length 16
set-option -g status-bg colour237
set-option -g status-right '#[bg=colour236] #[bg=colour235]#[fg=colour185] %a %R #[bg=colour236]#[fg=colour3] #[bg=colour235]#[fg=colour185] #H #[bg=colour236] '
set-option -g status-right-length 50
set-option -g status-interval 60

set-option -g pane-active-border-style fg=colour246
set-option -g pane-border-style fg=colour238

set-window-option -g window-status-format '#[bg=colour238]#[fg=colour107] #I #[bg=colour239]#[fg=colour110] #[bg=colour240]#W#[bg=colour239]#[fg=colour195]#F#[bg=colour238] '
set-window-option -g window-status-current-format '#[bg=colour236]#[fg=colour215] #I #[bg=colour235]#[fg=colour167] #[bg=colour234]#W#[bg=colour235]#[fg=colour195]#F#[bg=colour236] '
 
# pairing indicator
tmux_conf_theme_pairing='👓 '          # U+1F453
tmux_conf_theme_pairing_fg='none'
tmux_conf_theme_pairing_bg='none'
tmux_conf_theme_pairing_attr='none'
 
# prefix indicator
tmux_conf_theme_prefix='⌨ '            # U+2328
tmux_conf_theme_prefix_fg='none'
tmux_conf_theme_prefix_bg='none'
tmux_conf_theme_prefix_attr='none'
 
# root indicator
tmux_conf_theme_root='!'
tmux_conf_theme_root_fg='none'
tmux_conf_theme_root_bg='none'
tmux_conf_theme_root_attr='bold,blink'
 
# synchronized indicator
tmux_conf_theme_synchronized='🔒'     # U+1F512
tmux_conf_theme_synchronized_fg='none'
tmux_conf_theme_synchronized_bg='none'
tmux_conf_theme_synchronized_attr='none'
 
# battery bar symbols
tmux_conf_battery_bar_symbol_full='◼'
tmux_conf_battery_bar_symbol_empty='◻'
 
# battery bar length (in number of symbols)
tmux_conf_battery_bar_length='auto'
 
# battery bar palette
tmux_conf_battery_bar_palette='gradient'
 
# battery hbar palette
tmux_conf_battery_hbar_palette='gradient'
 
# battery vbar palette
tmux_conf_battery_vbar_palette='gradient'
 
# symbols used to indicate whether battery is charging or discharging
tmux_conf_battery_status_charging='↑'       # U+2191
tmux_conf_battery_status_discharging='↓'    # U+2193
 
# clock style (when you hit <prefix> + t)
tmux_conf_theme_clock_colour='#00afff'  # light blue
tmux_conf_theme_clock_style='24'
 
 
# -- clipboard -----------------------------------------------------------------
 
# in copy mode, copying selection also copies to the OS clipboard
tmux_conf_copy_to_os_clipboard=true
set -g set-clipboard on
 
 
# -- user customizations -------------------------------------------------------
 
# increase history size
set -g history-limit 50000
 
# start with mouse mode enabled
set -g mouse on
 
# activity monitoring
setw -g monitor-activity on
setw -g monitor-bell off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
set -g activity-action none
setw -g window-status-activity-style 'reverse'
bind-key x kill-pane
bind-key & kill-window
 
set-option -g repeat-time 500
 
# window naming: let the automatic name land once, then freeze it.
# tmux's automatic-rename re-labels a window every time the foreground
# command changes (bash -> nvim -> ssh -> ...). These hooks keep the
# initial automatic name and then switch automatic-rename off for that
# window, so the label only changes when you rename it with <prefix> r.
# <prefix> R re-enables automatic naming for the current window.
set -g automatic-rename on
set-hook -g after-new-window 'run-shell -b "sleep 1 && tmux set-option -w -t \"#{window_id}\" automatic-rename off"'
set-hook -g after-new-session 'run-shell -b "sleep 1 && tmux set-option -w -t \"#{window_id}\" automatic-rename off"'
bind R set -w automatic-rename on \; display-message "automatic-rename on for this window"

# Protect hand-picked window names from tools that run an explicit
# `tmux rename-window <name>` on launch (an explicit command, so allow-rename
# does not stop it). Every deliberate rename is remembered in @pinned_name;
# a later rename to @rename_guard is bounced back to that name. Windows that
# were never renamed by hand have no @pinned_name and are still allowed to
# take the guarded name. Hooks do not re-trigger hooks, so no loop.
# Set @rename_guard to whatever name the offending tool forces (e.g. "node").
# Left empty the hook only records names and bounces nothing.
set -g @rename_guard ""
set-hook -g after-rename-window 'if -F "#{==:#{window_name},#{@rename_guard}}" { if -F "#{@pinned_name}" { rename-window "#{@pinned_name}" } } { set -wF @pinned_name "#{window_name}" }'

# window management
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g display-panes-time 2000
unbind ,
unbind .
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind q new-window
# bind c was a shortcut that launched a CLI tool in a fresh window.
# Point it at whatever you want, e.g. bind c new-window "htop"
bind c new-window
bind . next-window
bind , previous-window
bind Tab last-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
 
# pane management
bind-key z resize-pane -Z
 
# Space cycles through layouts
bind-key Space run-shell '\
  PANES=$(tmux display-message -p "#{window_panes}"); \
  STATE=$(tmux show-environment LAYOUT_STATE 2>/dev/null | cut -d= -f2); \
  if [ "$PANES" = "2" ]; then \
    if [ "$STATE" = "vertical" ]; then \
tmux select-layout even-horizontal && tmux set-environment LAYOUT_STATE horizontal; \
    elif [ "$STATE" = "horizontal" ]; then \
tmux select-layout main-horizontal && tmux resize-pane -t 1 -y $(( $(tmux display-message -p "#{window_height}") * 70 / 100 )) && tmux set-environment LAYOUT_STATE main; \
    else \
tmux select-layout main-vertical && tmux resize-pane -t 1 -x $(( $(tmux display-message -p "#{window_width}") * 70 / 100 )) && tmux set-environment LAYOUT_STATE vertical; \
    fi; \
  elif [ "$PANES" = "3" ]; then \
    H=$(tmux display-message -p "#{window_height}"); \
    if [ "$STATE" = "main" ]; then \
tmux select-layout even-vertical && tmux resize-pane -t 1 -y $(( H * 70 / 100 )) && tmux resize-pane -t 2 -y $(( H * 15 / 100 )) && tmux set-environment LAYOUT_STATE dominant; \
    elif [ "$STATE" = "dominant" ]; then \
tmux select-layout even-vertical && tmux set-environment LAYOUT_STATE even; \
    else \
tmux select-layout even-vertical && tmux resize-pane -t 1 -y $(( H * 40 / 100 )) && tmux resize-pane -t 2 -y $(( H * 40 / 100 )) && tmux set-environment LAYOUT_STATE main; \
    fi; \
  elif [ "$PANES" = "4" ]; then \
    if [ "$STATE" = "vertical" ]; then \
tmux select-layout tiled && tmux set-environment LAYOUT_STATE tiled; \
    elif [ "$STATE" = "tiled" ]; then \
tmux select-layout main-horizontal && tmux resize-pane -t 1 -y $(( $(tmux display-message -p "#{window_height}") * 80 / 100 )) && tmux set-environment LAYOUT_STATE main; \
    else \
tmux select-layout main-vertical && tmux resize-pane -t 1 -x $(( $(tmux display-message -p "#{window_width}") * 70 / 100 )) && tmux set-environment LAYOUT_STATE vertical; \
    fi; \
  else \
    if [ "$STATE" = "vertical" ]; then \
tmux select-layout main-horizontal && tmux resize-pane -t 1 -y $(( $(tmux display-message -p "#{window_height}") * 80 / 100 )) && tmux set-environment LAYOUT_STATE main; \
    else \
tmux select-layout main-vertical && tmux resize-pane -t 1 -x $(( $(tmux display-message -p "#{window_width}") * 70 / 100 )) && tmux set-environment LAYOUT_STATE vertical; \
    fi; \
  fi'
 
# replace C-b by C-a instead of using both prefixes
set -gu prefix2
unbind C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
 
# pane splitting
bind h split-window -v
bind v split-window -h
 
# vim-style copy/paste
setw -g mode-keys vi
bind-key y copy-mode
bind-key p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
 
# Switch panes with Ctrl+a + arrow keys
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R
 
# Resize panes with Ctrl+a + Ctrl+arrow keys
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
 
# tmux 3.4 features
# Popup shell (prefix + g for quick commands without rearranging panes)
bind g display-popup -E -w 80% -h 60% "tmux"
# Popup fzf file finder (prefix + f)
bind f display-popup -E -w 80% -h 60% "nvim $(fd --type f | fzf --preview 'bat --color=always --line-range=:50 {}')"
# Popup lazygit
bind G display-popup -E -w 90% -h 80% "lazygit"


unbind -T root MouseDown3Pane
